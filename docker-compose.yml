version: "3.8"

services:
  db:
    image: postgres:16
    container_name: owna_postgres
    restart: always
    environment:
      POSTGRES_USER: ownauser
      POSTGRES_PASSWORD: ownapassword
      POSTGRES_DB: owna_childcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build: ./client
    container_name: owna_frontend
    ports:
      - "3000:80"
    depends_on:
      - db

  redis:
    image: redis:7
    container_name: owna_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
